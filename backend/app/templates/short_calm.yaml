# 하이라이트 숏폼 기본 템플릿 "calm" (9:16, 하이라이트 15초). 팀장 디자인 스펙이 오면 이 파일 값만 고친다.
# 좌표는 1080×1920 기준 px. 색은 A&R 노트 colors에서 고른다 (accent = 가장 밝은 색).
name: calm
size: [1080, 1920]
fps: 30
background:
  blur: 36          # 배경 = 커버를 꽉 채워 흐리게
  darken: 0.5       # 0~1, 낮을수록 어두움
cover:
  size: 880
  y: 330
  zoom_to: 1.07     # 15초 동안 천천히 확대되는 최종 배율
waveform:
  y: 1300
  height: 190
  mode: cline       # showwaves 모드 (line, p2p, cline)
hook:               # 틱톡 훅 문구 (없으면 무드 키워드)
  y: 150
  size: 66
  max_width: 960
title:
  y: 1580
  size: 58
artist:
  y: 1665
  size: 40
  opacity: 0.8
fade:
  in: 0.4
  out: 1.2
video:
  crf: 23
  preset: veryfast
  audio_bitrate: 160k
