<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>들어봐 — 인디 음악 커뮤니티</title>
<!-- 임시 화면 (백엔드 확인용). 팀장 화면이 나오면 대체. API: /docs 의 '커뮤니티' -->
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e4e2dd; --accent:#e0533c; --chip:#f0eee9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1f1f23; --ink:#f2f2f2; --sub:#9a9aa2; --line:#2e2e34; --accent:#ff7a5c; --chip:#2a2a30; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { padding:28px 16px 8px; max-width:1080px; margin:0 auto; }
  h1 { margin:0; font-size:26px; letter-spacing:-.5px; }
  .lead { color:var(--sub); margin:4px 0 0; }
  .bar { max-width:1080px; margin:0 auto; padding:12px 16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 14px; border-radius:99px; cursor:pointer; font:inherit; }
  .tab.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  input[type=search], input[type=text], textarea { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  input[type=search] { flex:1; min-width:160px; }
  main { max-width:1080px; margin:0 auto; padding:8px 16px 120px; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:transform .12s; }
  .card:hover { transform:translateY(-2px); }
  .cover { aspect-ratio:1; width:100%; display:block; object-fit:cover; background:var(--chip); }
  .meta { padding:10px 12px 12px; }
  .t { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { color:var(--sub); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; font-size:12px; color:var(--sub); }
  .badge { background:var(--chip); border-radius:6px; padding:1px 7px; font-size:12px; color:var(--ink); }
  .badge.hl { background:var(--accent); color:#fff; }
  .empty { grid-column:1/-1; text-align:center; color:var(--sub); padding:60px 0; }
  /* 상세 */
  dialog { border:none; border-radius:18px; padding:0; width:min(560px, calc(100vw - 32px)); background:var(--card); color:var(--ink); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .d-head { display:flex; gap:16px; padding:20px; }
  .d-head img { width:140px; height:140px; border-radius:10px; object-fit:cover; flex:none; }
  .d-body { padding:0 20px 20px; }
  .close { position:absolute; right:12px; top:10px; background:none; border:none; font-size:22px; color:var(--sub); cursor:pointer; }
  audio { width:100%; margin:6px 0 4px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--chip); border:1px solid transparent; border-radius:99px; padding:5px 12px; font-size:13px; cursor:pointer; color:var(--ink); font-family:inherit; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  .stars button { background:none; border:none; font-size:26px; cursor:pointer; color:var(--line); padding:0 2px; }
  .stars button.on { color:#f5b301; }
  h3 { font-size:14px; margin:18px 0 8px; }
  textarea { width:100%; min-height:70px; resize:vertical; }
  .send { margin-top:10px; width:100%; padding:11px; border:none; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .note { font-size:13px; color:var(--sub); }
  .ok { color:#1f9d55; font-size:14px; margin-top:8px; }
  .err { color:#d93025; font-size:14px; margin-top:8px; }
  .fb { border-top:1px solid var(--line); padding:10px 0; font-size:14px; }
  .fb b { font-size:13px; }
  .swatch { width:14px; height:14px; border-radius:4px; display:inline-block; }
  @media (max-width:480px) { .d-head { flex-direction:column; } .d-head img { width:100%; height:auto; aspect-ratio:1; } main { grid-template-columns:repeat(2, 1fr); gap:10px; } }
</style>
</head>
<body>
<header>
  <h1>들어봐 <span style="font-size:13px;color:var(--sub);font-weight:400">(가칭)</span></h1>
  <p class="lead">누구나 올린 노래를 듣고, 짧은 반응을 남겨 주세요. 처음 내는 음악일 수도 있어요.</p>
</header>
<div class="bar">
  <button class="tab on" data-sort="new">최신</button>
  <button class="tab" data-sort="popular">인기</button>
  <button class="tab" data-sort="random">아무거나</button>
  <input type="search" id="q" placeholder="곡 제목·아티스트 검색">
</div>
<main id="list"></main>

<dialog id="detail">
  <button class="close" id="close" aria-label="닫기">×</button>
  <div class="d-head">
    <img id="dCover" alt="">
    <div style="min-width:0">
      <div class="t" id="dTitle" style="font-size:20px;white-space:normal"></div>
      <div class="a" id="dArtist"></div>
      <div class="row" id="dBadges"></div>
      <p id="dIntro" style="margin:10px 0 0;font-size:14px"></p>
    </div>
  </div>
  <div class="d-body">
    <audio id="player" controls preload="none"></audio>
    <div class="note" id="dMode"></div>

    <h3>이 곡 어땠어요?</h3>
    <div class="stars" id="stars"></div>
    <div class="chips" id="tags" style="margin-top:8px"></div>
    <h3>한마디 (선택)</h3>
    <textarea id="comment" maxlength="500" placeholder="좋았던 부분, 아쉬운 부분 무엇이든"></textarea>
    <input type="text" id="nick" maxlength="20" placeholder="닉네임 (선택, 없으면 익명)" style="width:100%;margin-top:8px">
    <div class="note" id="privacy" style="margin-top:6px"></div>
    <button class="send" id="send">반응 보내기</button>
    <div id="sendMsg"></div>

    <div id="pubBlock"></div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const api = async (path, opt = {}) => {
  const r = await fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || '문제가 생겼어요');
  return d;
};
const fmtSec = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
let sort = 'new', TAGS = [], cur = null, rating = null, picked = new Set(), qTimer;

async function load() {
  const q = $('#q').value.trim();
  const d = await api(`/community/tracks?sort=${sort}&limit=50${q ? '&q=' + encodeURIComponent(q) : ''}`);
  const list = $('#list'); list.replaceChildren();
  if (!d.tracks.length) { list.append(el('div', { className: 'empty', textContent: q ? '찾는 곡이 없어요.' : '아직 올라온 곡이 없어요. 첫 곡을 올려 보세요!' })); return; }
  for (const t of d.tracks) {
    const card = el('div', { className: 'card' },
      el('img', { className: 'cover', src: t.cover_url, alt: '', loading: 'lazy' }),
      el('div', { className: 'meta' },
        el('div', { className: 't', textContent: t.title }),
        el('div', { className: 'a', textContent: t.artist + (t.genre ? ' · ' + t.genre : '') }),
        el('div', { className: 'row' },
          el('span', { className: 'badge' + (t.listen_mode === 'highlight' ? ' hl' : ''), textContent: t.listen_mode === 'highlight' ? `하이라이트 ${Math.round(t.clip_sec)}초` : `전곡 ${fmtSec(t.clip_sec)}` }),
          el('span', { textContent: `▶ ${t.plays}` }), el('span', { textContent: `💬 ${t.reactions}` }))));
    card.onclick = () => open(t.track_id);
    list.append(card);
  }
}

async function open(id) {
  const t = await api(`/community/tracks/${id}`);
  cur = t; rating = null; picked = new Set();
  history.replaceState(null, '', `#${id}`);
  $('#dCover').src = t.cover_url; $('#dTitle').textContent = t.title; $('#dArtist').textContent = t.artist;
  $('#dIntro').textContent = t.intro;
  $('#dBadges').replaceChildren(...(t.genre ? [el('span', { className: 'badge', textContent: t.genre })] : []),
    ...t.moods.map(m => el('span', { className: 'badge', textContent: m })),
    ...t.colors.map(c => el('span', { className: 'swatch', style: `background:${c}` })));
  $('#dMode').textContent = t.listen_mode === 'highlight' ? `올린 사람이 하이라이트 ${Math.round(t.clip_sec)}초만 공개했어요.` : '전곡을 들을 수 있어요.';
  const p = $('#player'); p.src = t.audio_url; p.dataset.counted = '';
  $('#privacy').textContent = t.comments_public ? '남긴 반응은 이 곡 페이지에 공개돼요.' : '🔒 남긴 반응은 올린 사람에게만 전달돼요.';
  $('#comment').value = ''; $('#sendMsg').replaceChildren();
  drawStars(); drawTags(); drawPublic(t);
  $('#detail').showModal();
}

function drawStars() {
  $('#stars').replaceChildren(...[1, 2, 3, 4, 5].map(i => {
    const b = el('button', { textContent: '★', className: rating && i <= rating ? 'on' : '', title: `${i}점` });
    b.onclick = () => { rating = rating === i ? null : i; drawStars(); }; return b;
  }));
}
function drawTags() {
  $('#tags').replaceChildren(...TAGS.map(tag => {
    const b = el('button', { className: 'chip' + (picked.has(tag) ? ' on' : ''), textContent: tag });
    b.onclick = () => { picked.has(tag) ? picked.delete(tag) : picked.add(tag); drawTags(); }; return b;
  }));
}
function drawPublic(t) {
  const box = $('#pubBlock'); box.replaceChildren();
  if (!t.comments_public) return;
  const s = t.stats;
  box.append(el('h3', { textContent: `반응 ${s.reactions}개` + (s.rating_avg ? ` · 평균 ★${s.rating_avg}` : '') }));
  const top = Object.entries(s.tags).filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  if (top.length) box.append(el('div', { className: 'chips' }, ...top.map(([k, n]) => el('span', { className: 'badge', textContent: `${k} ${n}` }))));
  for (const f of t.feedback.filter(f => f.comment)) {
    box.append(el('div', { className: 'fb' }, el('b', { textContent: f.nickname + (f.rating ? ` ★${f.rating}` : '') }), el('div', { textContent: f.comment })));
  }
}

$('#player').addEventListener('play', async e => {
  if (e.target.dataset.counted) return;
  e.target.dataset.counted = '1';
  api(`/community/tracks/${cur.track_id}/play`, { method: 'POST' }).catch(() => {});
});
$('#send').onclick = async () => {
  const msg = $('#sendMsg');
  try {
    await api(`/community/tracks/${cur.track_id}/feedback`, { method: 'POST', body: JSON.stringify({
      rating, tags: [...picked], comment: $('#comment').value.trim() || null, nickname: $('#nick').value.trim() || null }) });
    msg.replaceChildren(el('div', { className: 'ok', textContent: cur.comments_public ? '고마워요! 반응이 올라갔어요.' : '고마워요! 올린 사람에게 전달했어요.' }));
    $('#comment').value = ''; rating = null; picked = new Set(); drawStars(); drawTags();
    if (cur.comments_public) drawPublic(await api(`/community/tracks/${cur.track_id}`));
    load();
  } catch (e) { msg.replaceChildren(el('div', { className: 'err', textContent: e.message })); }
};
$('#close').onclick = () => $('#detail').close();
$('#detail').addEventListener('close', () => { $('#player').pause(); history.replaceState(null, '', location.pathname); });
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); sort = b.dataset.sort; load();
});
$('#q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(load, 300); };

(async () => {
  TAGS = (await api('/community/meta')).tags;
  await load();
  const id = location.hash.slice(1);
  if (id) open(id).catch(() => {});
})();
</script>
</body>
</html>
