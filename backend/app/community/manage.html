<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 곡 관리 — 발매로</title>
<!-- 임시 화면 (백엔드 확인용). 주소: /community/manage?t=<track_id>#key=<owner_key> — 키는 # 뒤라 서버로 안 감 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 10/18: 팀장 화면(발매로, Tailwind studio 색)과 같은 모양. 다크 모드는 화면과 같은 localStorage 'studio_theme'를 따른다 -->
<script>
  try { const t = localStorage.getItem('studio_theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  :root { --bg:#fcfcfd; --card:#ffffff; --ink:#18181b; --sub:#71717a; --line:#e4e4e7; --accent:#6366f1; --accent2:#4f46e5; --chip:#f4f4f5; --danger:#e11d48; --ok:#10b981; }
  :root[data-theme=dark] { --bg:#09090b; --card:#18181b; --ink:#f4f4f5; --sub:#a1a1aa; --line:rgba(255,255,255,.08); --chip:#27272a; --danger:#fb7185; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  :root[data-theme=dark] body { background:radial-gradient(1200px 600px at 20% -10%, rgba(99,102,241,.18), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(14,165,233,.10), transparent 60%), var(--bg); background-attachment:fixed; }
  .bar { position:sticky; top:0; z-index:5; backdrop-filter:blur(12px); background:color-mix(in srgb, var(--bg) 80%, transparent); border-bottom:1px solid var(--line); }
  .bar .in { max-width:760px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:var(--ink); text-decoration:none; }
  .brand .dot { width:26px; height:26px; border-radius:50%; background:conic-gradient(from 210deg, #6366f1, #0ea5e9, #6366f1); box-shadow:inset 0 0 0 6px var(--bg); }
  .brand small { font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); padding:2px 7px; border-radius:999px; }
  .back { margin-left:auto; font-size:13px; font-weight:600; color:var(--sub); background:var(--chip); border:1px solid var(--line); border-radius:10px; padding:6px 12px; cursor:pointer; text-decoration:none; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 80px; }
  .eyebrow { display:inline-block; font-size:12px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); padding:3px 10px; border-radius:999px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; margin-top:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .head { display:flex; gap:16px; align-items:center; }
  .head img { width:104px; height:104px; border-radius:14px; object-fit:cover; flex:none; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  h1 { margin:6px 0 2px; font-size:22px; font-weight:800; letter-spacing:-.01em; } h2 { margin:0 0 12px; font-size:15px; font-weight:800; }
  .sub { color:var(--sub); font-size:13px; }
  .nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; text-align:center; }
  .nums > div { background:var(--chip); border-radius:14px; padding:12px 6px; }
  .nums b { display:block; font-size:24px; font-weight:800; }
  .barrow { display:flex; align-items:center; gap:8px; font-size:13px; margin:6px 0; }
  .barrow span:first-child { width:110px; flex:none; }
  .track { flex:1; background:var(--chip); border-radius:999px; height:8px; overflow:hidden; }
  .track i { display:block; height:100%; background:linear-gradient(90deg, #6366f1, #0ea5e9); border-radius:999px; }
  .fb { border-top:1px solid var(--line); padding:12px 0; font-size:14px; }
  .fb.hidden { opacity:.45; }
  .fb small { color:var(--sub); }
  .link { background:none; border:none; color:var(--sub); text-decoration:underline; cursor:pointer; font:inherit; font-size:12px; padding:0; }
  .q { margin-top:16px; } .q > b { display:block; font-size:14px; margin-bottom:8px; } .q .req { color:var(--danger); font-size:12px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; } .mrow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:6px 0; } .mrow > span { width:84px; flex:none; font-size:13px; color:var(--sub); }
  .chip { font:inherit; font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--ink); cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  textarea { width:100%; min-height:72px; font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:10px 12px; resize:vertical; }
  .done { display:flex; align-items:center; gap:10px; margin-top:14px; padding:12px 14px; border-radius:12px; background:color-mix(in srgb, var(--ok) 12%, transparent); color:var(--ok); font-weight:700; font-size:14px; }
  label.opt { display:flex; gap:10px; align-items:flex-start; margin:8px 0; cursor:pointer; padding:10px 12px; border:1px solid var(--line); border-radius:12px; }
  label.opt:has(input:checked) { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); }
  input[type=radio] { accent-color:var(--accent); margin-top:4px; }
  input[type=text] { width:100%; font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  input[type=text]:focus { outline:2px solid color-mix(in srgb, var(--accent) 50%, transparent); }
  .main { display:inline-block; padding:9px 16px; border:none; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; box-shadow:0 6px 18px rgba(99,102,241,.3); }
  .main:hover { background:var(--accent2); }
  button.danger { padding:9px 16px; border:1px solid var(--danger); border-radius:12px; background:none; color:var(--danger); font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .err { color:var(--danger); margin-top:14px; } .ok { color:var(--ok); }
  code { display:block; background:var(--chip); padding:10px 12px; border-radius:10px; font-size:12px; word-break:break-all; }
  @media (max-width:520px) { .head img { width:84px; height:84px; } h1 { font-size:19px; } }
</style>
</head>
<body>
<div class="bar"><div class="in">
  <a class="brand" id="home" href="/"><span class="dot"></span>발매로 <small>STUDIO</small></a>
  <a class="back" id="back" href="/">← 발매로로 돌아가기</a>
</div></div>
<div class="wrap">
  <span class="eyebrow">'들어봐' 커뮤니티 · 내 곡 관리</span>
  <div id="err" class="err"></div>
  <div id="app" hidden>
    <div class="box head">
      <img id="cover" alt="">
      <div><h1 id="title"></h1><div class="sub" id="artist"></div><div class="sub" id="mode"></div></div>
    </div>

    <div class="box">
      <div class="nums">
        <div><b id="plays">0</b><span class="sub">재생</span></div>
        <div><b id="reactions">0</b><span class="sub">반응</span></div>
        <div><b id="avg">-</b><span class="sub">평균 별점</span></div>
      </div>
    </div>

    <div class="box"><h2>들은 사람들이 고른 것</h2><div id="tagBars"></div><h2 style="margin-top:16px">별점 분포</h2><div id="ratingBars"></div></div>

    <div class="box"><h2>받은 의견 <span class="sub" id="pubNote"></span></h2><div id="feedback"></div></div>

    <div class="box">
      <h2>설정</h2>
      <div class="sub">어떻게 들려줄까요?</div>
      <label class="opt"><input type="radio" name="mode" value="highlight"> <span><b>하이라이트만</b> — A&R 노트에서 고른 15초 구간</span></label>
      <label class="opt"><input type="radio" name="mode" value="full"> <span><b>전곡</b></span></label>
      <div class="sub" style="margin-top:12px">의견은 누가 볼까요?</div>
      <label class="opt"><input type="radio" name="pub" value="1"> <span><b>공개</b> — 곡 페이지에 의견과 별점이 보여요</span></label>
      <label class="opt"><input type="radio" name="pub" value="0"> <span><b>나만 보기</b> — 들은 사람의 의견은 여기서만 볼 수 있어요</span></label>
      <div class="sub" style="margin-top:12px">한 줄 소개</div>
      <input type="text" id="intro" maxlength="500">
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center"><button class="main" id="save">저장</button><span id="saveMsg"></span></div>
    </div>

    <div class="box" id="surveyBox">
      <h2>1분 설문 — 써 보니 어땠나요?</h2>
      <div class="sub">이름·연락처는 받지 않고, 서비스를 고치는 데만 써요. 어디까지 썼는지는 자동으로 기록돼서 따로 묻지 않아요.</div>
      <div id="survey"></div>
    </div>

    <div class="box">
      <h2>관리 링크</h2>
      <div class="sub">이 페이지 주소가 곧 열쇠예요. 다른 사람에게 보내지 말고 따로 저장해 두세요.</div>
      <p><code id="manageUrl"></code></p>
      <button class="main" id="copy">주소 복사</button>
    </div>

    <div class="box">
      <h2>곡 내리기</h2>
      <div class="sub">음원·커버·받은 반응이 모두 지워지고 되돌릴 수 없어요.</div>
      <p><button class="danger" id="del">곡 내리기</button> <span id="delMsg"></span></p>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// 돌아가기: 화면에서 새 창으로 열었으면 창을 닫고, 아니면 화면 첫 페이지로 (api 주소에서는 /app/)
const HOME = location.hostname === 'api.201.n-e.kr' ? '/app/' : '/';
for (const a of [$('#home'), $('#back')]) a.href = HOME;
$('#back').onclick = (e) => { if (window.opener && !window.opener.closed) { e.preventDefault(); window.close(); } };
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const tid = new URLSearchParams(location.search).get('t');
const key = new URLSearchParams(location.hash.slice(1)).get('key');
const api = async (path, opt = {}) => {
  const r = await fetch(path, { ...opt, headers: { 'Content-Type': 'application/json', 'X-Owner-Key': key || '', ...(opt.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || '문제가 생겼어요');
  return d;
};
const bars = (box, entries, max) => box.replaceChildren(...entries.map(([k, n]) =>
  el('div', { className: 'barrow' }, el('span', { textContent: k }),
    el('div', { className: 'track' }, el('i', { style: `width:${max ? n / max * 100 : 0}%` })), el('span', { textContent: n }))));

function render(t) {
  $('#app').hidden = false;
  $('#cover').src = t.cover_url; $('#title').textContent = t.title; $('#artist').textContent = t.artist;
  $('#mode').textContent = (t.listen_mode === 'highlight' ? `하이라이트 ${Math.round(t.clip_sec)}초 공개` : '전곡 공개') + ' · 의견 ' + (t.comments_public ? '공개' : '나만 보기');
  $('#plays').textContent = t.plays; $('#reactions').textContent = t.stats.reactions;
  $('#avg').textContent = t.stats.rating_avg ? '★' + t.stats.rating_avg : '-';
  const tags = Object.entries(t.stats.tags).sort((a, b) => b[1] - a[1]);
  bars($('#tagBars'), tags, Math.max(...tags.map(x => x[1]), 1));
  const dist = [5, 4, 3, 2, 1].map(i => [`★${i}`, t.stats.rating_dist[i]]);
  bars($('#ratingBars'), dist, Math.max(...dist.map(x => x[1]), 1));
  $('#pubNote').textContent = t.comments_public ? '(곡 페이지에 공개 중)' : '(나만 보는 중)';
  const fb = $('#feedback'); fb.replaceChildren();
  if (!t.feedback.length) fb.append(el('div', { className: 'sub', textContent: '아직 받은 반응이 없어요. 커뮤니티 주소를 친구들에게도 알려 보세요.' }));
  for (const f of t.feedback) {
    const hideBtn = el('button', { className: 'link', textContent: f.hidden ? '다시 보이기' : '숨기기' });
    hideBtn.onclick = async () => { await api(`/community/tracks/${tid}/feedback/${f.id}/hide`, { method: 'POST', body: JSON.stringify({ hidden: !f.hidden }) }); load(); };
    fb.append(el('div', { className: 'fb' + (f.hidden ? ' hidden' : '') },
      el('div', {}, el('b', { textContent: f.nickname }), ' ', el('small', { textContent: (f.rating ? '★' + f.rating + ' · ' : '') + new Date(f.created_at).toLocaleString('ko-KR') }), ' ', hideBtn),
      ...(f.tags.length ? [el('div', { className: 'sub', textContent: f.tags.join(' · ') })] : []),
      ...(f.comment ? [el('div', { textContent: f.comment })] : [])));
  }
  document.querySelector(`input[name=mode][value=${t.listen_mode}]`).checked = true;
  document.querySelector(`input[name=pub][value="${t.comments_public ? 1 : 0}"]`).checked = true;
  $('#intro').value = t.intro;
  $('#manageUrl').textContent = location.href;
}

// 1분 설문 (10/18): 예전 /studio 설문 화면 대신 여기서 바로 답한다. 문항은 서버(GET .../survey)가 정한다
let survey = null, answers = {};
function chips(opts, cur, onPick) {
  return el('div', { className: 'chips' }, ...Object.entries(opts).map(([v, label]) => {
    const b = el('button', { type: 'button', className: 'chip' + (cur === v ? ' on' : ''), textContent: label });
    b.onclick = () => onPick(v);
    return b;
  }));
}
function renderSurvey(editing = false) {
  const box = $('#survey');
  if (survey.answered_at && !editing) {
    const again = el('button', { className: 'link', textContent: '답 고치기' });
    again.onclick = () => renderSurvey(true);
    box.replaceChildren(el('div', { className: 'done' }, '✓ 설문에 답해 주셔서 고마워요!', again));
    return;
  }
  const kids = survey.questions.map((q) => {
    const head = el('b', { textContent: q.question }, ...(q.required ? [' ', el('span', { className: 'req', textContent: '(필수)' })] : []));
    if (q.type === 'choice') return el('div', { className: 'q' }, head, chips(q.options, answers[q.id], (v) => { answers[q.id] = v; renderSurvey(true); }));
    if (q.type === 'matrix') return el('div', { className: 'q' }, head, ...Object.entries(q.rows).map(([r, label]) =>
      el('div', { className: 'mrow' }, el('span', { textContent: label }),
        chips(q.options, (answers[q.id] || {})[r], (v) => { answers[q.id] = { ...(answers[q.id] || {}), [r]: v }; renderSurvey(true); }))));
    const t = el('textarea', { maxLength: q.max_length || 500, value: answers[q.id] || '' });
    t.oninput = () => { answers[q.id] = t.value; };
    return el('div', { className: 'q' }, head, t);
  });
  const msg = el('span', { className: 'err' });
  const send = el('button', { className: 'main', textContent: '보내기' });
  send.onclick = async () => {
    const miss = survey.questions.find((q) => q.required && !answers[q.id]);
    if (miss) { msg.textContent = `'${miss.question}'에 답해 주세요.`; return; }
    send.disabled = true; msg.textContent = '';
    try { survey = await api(`/community/tracks/${tid}/survey`, { method: 'PUT', body: JSON.stringify({ answers }) }); renderSurvey(); }
    catch (e) { msg.textContent = e.message; send.disabled = false; }
  };
  box.replaceChildren(...kids, el('div', { style: 'margin-top:16px;display:flex;gap:10px;align-items:center' }, send, msg));
}
async function loadSurvey() {
  try { survey = await api(`/community/tracks/${tid}/survey`); answers = { ...(survey.answers || {}) }; renderSurvey(); }
  catch (e) { $('#surveyBox').hidden = true; }  // 설문을 못 불러오면 칸을 숨긴다 (곡 관리는 그대로)
}
async function load() {
  try { render(await api(`/community/tracks/${tid}/owner`)); if (!survey) loadSurvey(); }
  catch (e) { $('#err').textContent = e.message; }
}
$('#save').onclick = async () => {
  const msg = $('#saveMsg'); msg.className = ''; msg.textContent = '저장 중…';
  try {
    render(await api(`/community/tracks/${tid}`, { method: 'PATCH', body: JSON.stringify({
      listen_mode: document.querySelector('input[name=mode]:checked').value,
      comments_public: document.querySelector('input[name=pub]:checked').value === '1', intro: $('#intro').value }) }));
    msg.className = 'ok'; msg.textContent = '저장했어요';
  } catch (e) { msg.className = 'err'; msg.textContent = e.message; }
};
$('#copy').onclick = () => navigator.clipboard.writeText(location.href).then(() => $('#copy').textContent = '복사했어요');
let armed = false;
$('#del').onclick = async () => {
  if (!armed) { armed = true; $('#del').textContent = '정말 내릴게요 (한 번 더 누르기)'; return; }
  try { await api(`/community/tracks/${tid}`, { method: 'DELETE' }); $('#app').hidden = true; $('#err').className = 'ok'; $('#err').textContent = '곡을 내렸어요.'; }
  catch (e) { $('#delMsg').textContent = e.message; }
};
if (!tid || !key) $('#err').textContent = '관리 링크가 올바르지 않아요. 곡을 올릴 때 받은 주소 전체로 열어 주세요.';
else load();
</script>
</body>
</html>
